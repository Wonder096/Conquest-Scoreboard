<!doctype html>
<html lang="ko" data-theme="dark">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <title>Hall of Glory</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="wrap">
    <header class="top">
      <div class="brand">
        <h1>Hall of Glory</h1>
        <p class="sub">새로고침 시 데이터가 초기화됩니다 · 제작 Xesi</p>
      </div>
    </header>

    <section class="card" id="registerCard">
      <div class="card-head">
        <h2>선수 등록</h2>
        <div class="hint">인원 4명 고정 · 닉네임 중복 불가</div>
      </div>
      <div id="playerInputs" class="grid"></div>
      <div class="row">
        <button id="savePlayers" class="primary">등록 완료</button>
      </div>
    </section>

    <div class="main-layout hidden" id="mainBoard">
      <section class="card" id="scoreCard">
        <div class="card-head">
          <h2>점령 순위 입력</h2>
        </div>
        <div id="scoreInputs" class="grid"></div>
        <div class="row">
          <button id="addRound" class="primary">점수 추가</button>
          <button id="clearInputs" class="ghost">다시 입력</button>
          <div class="spacer"></div>
          <span id="playStatus" class="pill"></span>
        </div>
      </section>

      <section class="card" id="boardCard">
        <div class="board-layout">
          <div id="board" class="board-left"></div>
          <div class="board-right game-log-scroll">
            <div class="log-header-sticky">최근 기록</div>
            <div id="gameLog"></div>
          </div>
        </div>
      </section>
    </div>

    <section class="card" id="bottomCard">
      <div class="row">
        <button id="themeToggle" class="ghost">다크모드: ON</button>
        <button id="editPlayers" class="ghost hidden">닉네임 수정</button>
        <button id="undoRound" class="ghost">되돌리기</button>
        <div class="spacer"></div>
        <button id="exportData" class="ghost">저장</button>
        <button id="importData" class="ghost">불러오기</button>
        <button id="settle" class="primary ghost">정산</button>
        <button id="resetAll" class="danger">리셋</button>
        <input id="importFile" type="file" accept="application/json" class="fileHidden" />
      </div>
    </section>
  </div>
  <script src="app.js"></script>
</body>
</html>
